name: Test Isorun

on:
  workflow_dispatch:

  push:
    branches:
      - isorun-ai

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Isorun
        run: npm install isorun

      - name: Create test Sandbox
        env:
          ISORUN_API_KEY: ${{ secrets.ISORUN_API_KEY }}
        run: |
          node --input-type=module <<'EOF'
          import { Isorun } from 'isorun'

          const isorun = new Isorun()

          console.log('开始创建 node:22-slim Sandbox...')

          const sandbox = await isorun.create({
            image: 'node:22-slim',
            timeoutSec: 300
          })

          console.log('创建成功:', sandbox.id)

          const result = await sandbox.exec('node -v')

          console.log('Node 版本:', result.stdout)
          console.log('退出码:', result.exitCode)

          await sandbox.destroy()
          isorun.close()

          console.log('测试 Sandbox 已销毁')
          EOF
