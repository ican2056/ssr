name: Start Isorun

on:
  workflow_dispatch:

  push:
    branches:
      - isorun-ai

concurrency:
  group: isorun
  cancel-in-progress: true

jobs:
  start:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Isorun
        run: |
          mkdir -p /tmp/isorun-deploy
          cd /tmp/isorun-deploy
          npm init -y
          npm install isorun

      - name: Start Isorun
        working-directory: /tmp/isorun-deploy
        env:
          ISORUN_API_KEY: ${{ secrets.ISORUN_API_KEY }}
        run: |
          node --input-type=module <<'EOF'
          import { Isorun } from 'isorun'

          const IMAGE = 'docker.io/ican2056/ssr:v1'
          const TIMEOUT = 4 * 60 * 60

          const isorun = new Isorun()

          console.log('Isorun API:', isorun.apiUrl)

          console.log('1. 查询现有 Sandbox...')
          const oldSandboxes = await isorun.list()
          console.log(`找到 ${oldSandboxes.length} 个 Sandbox`)

          for (const old of oldSandboxes) {
            console.log('删除旧 Sandbox:', old.id)
            await old.destroy()
          }

          console.log('2. 创建新 Sandbox...')
          const sandbox = await isorun.create({
            image: IMAGE,
            timeoutSec: TIMEOUT
          })

          console.log('创建成功:', sandbox.id)
          console.log('镜像准备耗时:', sandbox.createMs, 'ms')

          console.log('3. 启动程序...')
          const result = await sandbox.exec(
            '/bin/bash -lc "nohup setsid /bin/bash /app/start.sh >/tmp/ss.log 2>&1 </dev/null &"',
            10
          )

          if (result.exitCode !== 0) {
            console.error('stdout:', result.stdout)
            console.error('stderr:', result.stderr)
            await sandbox.destroy()
            throw new Error('启动 /app/start.sh 失败')
          }

          const httpUrl = sandbox.url(80)
          const wsUrl = sandbox.url(80, '/wechat')
            .replace(/^https:/, 'wss:')

          console.log('HTTP:', httpUrl)
          console.log('WebSocket:', wsUrl)
          console.log('约 4 小时后自动销毁')

          isorun.close()
          EOF
